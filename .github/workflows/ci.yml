name: CI

# 1. Triggers: Cuándo se ejecuta
on:
  pull_request: #cada PR
  push:
    branches: [main] #cada merge a main
  workflow_dispatch:  # botón manual "Run Workflow" en la pestaña Actions

# 2. Concurrencia: si haces push dos veces seguidas, cancela la corrida vieja (ahorra minutos)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: macos-26 # 3. Runner
    timeout-minutes: 30 # protección para que no se cuelgue

    steps:
      # 4 trae el el código: el runner arranca vacío
      - uses: actions/checkout@v4

      # 5 Elegir xcode: el proyecto pide iOS 26.5 asì que necesitamos >= 26.5
      - name: Seleccionar Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # 6. Diagnóstico: qué simuladores tiene esta máquina
      - name: Simuladores disponibles
        run: xcrun simctl list devices available | grep -i iphone

      # 6.5 Cache de DerivedData: xcodebuild compila incrementalmente si encuentra
      # objetos de una corrida anterior. Key única por run (siempre "falla" el match
      # exacto) + restore-keys con el mismo prefijo => siempre restaura el cache más
      # reciente de la rama, y siempre guarda uno nuevo al final.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .build/DerivedData
          key: deriveddata-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            deriveddata-${{ runner.os }}-

      # 6.6 Cache de descargas de Homebrew: no evita el "brew install" en sí,
      # pero evita re-descargar el bottle de swiftlint si no cambió de versión.
      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-swiftlint-${{ runner.os }}

      - name: Instalar SwiftLint
        run: brew install swiftlint
        
      # 7. El mismo comando que corres en local
      - name: Gate
        run: scripts/factory/gate.sh

